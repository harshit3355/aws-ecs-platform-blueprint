# Continuous delivery.
#
#   merge to main -> build and push -> deploy staging -> smoke test
#                 -> MANUAL APPROVAL -> deploy production -> smoke test
#
# The approval gate is a GitHub Environment protection rule, not a step in this
# file. That matters: a rule stored in the repository settings cannot be removed
# by editing the workflow in the same pull request that wants to bypass it.
# Configure it once under Settings > Environments > production > Required
# reviewers. See README, "Deployment pipeline".

name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Existing image tag to redeploy (leave blank to build from HEAD)"
        required: false
        type: string

# Never run two deploys at once, and never cancel one half-way: an interrupted
# ECS rollout leaves a service in a mixed state.
concurrency:
  group: cd-main
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-24.04-arm
    outputs:
      image_tag: ${{ steps.meta.outputs.image_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to ECR
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Compute image coordinates
        id: meta
        run: |
          TAG="${{ inputs.image_tag }}"
          if [ -z "$TAG" ]; then
            TAG="sha-$(git rev-parse --short=12 HEAD)"
          fi
          REGISTRY="${{ steps.ecr.outputs.registry }}"
          echo "image_tag=$TAG"                                      >> "$GITHUB_OUTPUT"
          echo "image_uri=$REGISTRY/${{ vars.ECR_REPOSITORY }}:$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ./services/api
          platforms: linux/arm64
          push: false
          load: true
          tags: ${{ steps.meta.outputs.image_uri }}
          build-args: |
            APP_VERSION=${{ steps.meta.outputs.image_tag }}
          provenance: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan before push
        # Scanning before the push, not after, is the whole point: a vulnerable
        # image never reaches the registry, so it can never be deployed by
        # someone pulling "the latest build" while the fix is in flight.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.meta.outputs.image_uri }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: docker push "${{ steps.meta.outputs.image_uri }}"

  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        uses: ./.github/actions/deploy-ecs
        with:
          cluster: ${{ vars.STAGING_ECS_CLUSTER }}
          service: ${{ vars.STAGING_ECS_SERVICE }}
          task-family: ${{ vars.STAGING_TASK_FAMILY }}
          image-uri: ${{ needs.build.outputs.image_uri }}
          app-version: ${{ needs.build.outputs.image_tag }}
          health-url: ${{ vars.STAGING_URL }}/health

  deploy-production:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: [build, deploy-staging]

    # ---- THE MANUAL APPROVAL STEP ----
    # Naming an environment that has "Required reviewers" configured suspends
    # this job until a named human approves it in the Actions UI. Nothing in
    # this repository can skip it, and the approval is recorded in the
    # deployment history against the reviewer.
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Deploy
        # The exact image that was built once, scanned once, and has been
        # running in staging. Production never rebuilds from source: a rebuild
        # is a different artifact, however identical the inputs look.
        uses: ./.github/actions/deploy-ecs
        with:
          cluster: ${{ vars.PRODUCTION_ECS_CLUSTER }}
          service: ${{ vars.PRODUCTION_ECS_SERVICE }}
          task-family: ${{ vars.PRODUCTION_TASK_FAMILY }}
          image-uri: ${{ needs.build.outputs.image_uri }}
          app-version: ${{ needs.build.outputs.image_tag }}
          health-url: ${{ vars.PRODUCTION_URL }}/health

  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build, deploy-staging, deploy-production]
    if: always() && (failure() || success())

    steps:
      - name: Post result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OUTCOME: ${{ contains(needs.*.result, 'failure') && 'failed' || 'succeeded' }}
          ICON: ${{ contains(needs.*.result, 'failure') && ':rotating_light:' || ':white_check_mark:' }}
          IMAGE_TAG: ${{ needs.build.outputs.image_tag }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        if: env.SLACK_WEBHOOK_URL != ''
        run: |
          jq -n --arg icon "$ICON" --arg outcome "$OUTCOME" --arg tag "$IMAGE_TAG" --arg url "$RUN_URL" \
            '{text: ($icon + " *Deploy " + $outcome + "* - `" + $tag + "`\n<" + $url + "|View run>")}' \
            | curl -fsS -X POST -H 'Content-type: application/json' --data @- "$SLACK_WEBHOOK_URL"
