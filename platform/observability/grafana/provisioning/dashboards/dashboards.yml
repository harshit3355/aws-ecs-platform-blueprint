apiVersion: 1

providers:
  - name: meridian
    orgId: 1
    folder: Meridian
    type: file
    disableDeletion: false
    # Dashboards live in git. Edits made in the UI are overwritten on reload by
    # design: the JSON files are the source of truth.
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
