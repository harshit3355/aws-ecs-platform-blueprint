global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    env: local
    service: meridian-api

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: meridian-api
    metrics_path: /metrics
    static_configs:
      - targets: ["app:8000"]
        labels:
          service: meridian-api
    # In AWS this static target is replaced by ecs_sd_config / ECS Service
    # Connect discovery; the scrape config and every dashboard query stay
    # identical, which is the point of scraping the app rather than the platform.

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]
        labels:
          service: meridian-db
